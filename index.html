<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL 2026 Schedule</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f2f4f7;
      color: #333;
    }
    /* App Bar / Header */
    .app-bar {
      background-color: #008768;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .app-title {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    /* Tabs Navigation */
    .nav-tabs {
      background-color: #008768;
      display: flex;
      overflow-x: auto;
      border-bottom: 3px solid #008768;
    }
    .tab {
      color: #b2dfdb;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
    }
    .tab.active {
      color: white;
      border-bottom: 3px solid white;
    }
    /* Date Header */
    .date-header {
      padding: 14px 16px 6px;
      font-size: 12px;
      font-weight: 700;
      color: #222;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    /* Card Container */
    .match-card {
      background-color: #ffffff;
      margin-bottom: 8px;
      padding: 12px 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .match-meta {
      font-size: 12px;
      color: #757575;
      margin-bottom: 12px;
    }
    .team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .team-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    /* Exact Logo Styles matching Points Table Screenshot */
    .team-logo {
      width: 26px;
      height: 26px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .team-logo svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    .pbks { background-color: #d32f2f; } /* Red Shield */
    .rr   { background-color: #e91e63; } /* Pink Crown */
    .lsg  { background-color: #7a1c1c; } /* Maroon Garuda */
    .srh  { background-color: #f4511e; } /* Orange Wings */
    .csk  { background-color: #d4a017; } /* Yellow Lion */
    .rcb  { background-color: #b71c1c; } /* Red Lion Shield */
    .mi   { background-color: #0288d1; } /* Blue Hurricane */
    .gt   { background-color: #0d1b2a; } /* Dark Blue Lightning */
    .kkr  { background-color: #4a148c; } /* Purple Knight Helmet */
    .dc   { background-color: #1a237e; } /* Dark Blue Dome */

    .team-name {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    /* Match Status / Time */
    .match-status {
      font-size: 13px;
      color: #0277bd;
      font-weight: 500;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- App Header Bar -->
  <div class="app-bar">
    <div class="app-title">
      <span>&#8592;</span>
      <span>Indian Premier League</span>
    </div>
    <div>&#10006;</div>
  </div>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <a href="#" class="tab active">Matches</a>
    <a href="#" class="tab">Table</a>
    <a href="#" class="tab">Stats</a>
    <a href="#" class="tab">Squads</a>
    <a href="#" class="tab">News</a>
  </div>

  <!-- Match 1 -->
  <div class="date-header">DATE TBD</div>
  <div class="match-card">
    <div class="match-meta">1st Match &bull; Jaipur</div>
    <div class="team-row">
      <div class="team-info">
        <div class="team-logo pbks">
          <svg viewBox="0 0 24 24"><path d="M12 2L4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-5.45 8-12V5l-8-3zm0 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm0 12c-2.67 0-8 1.34-8 4v1h16v-1c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="team-name">PBKS</div>
      </div>
    </div>
    <div class="team-row">
      <div class="team-info">
        <div class="team-logo rr">
          <svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .55-.45 1-1 1H6c-.55 0-1-.45-1-1v-1h14v1z"/></svg>
        </div>
        <div class="team-name">RR</div>
      </div>
    </div>
    <div class="match-status">7:30 PM</div>
  </div>

  <!-- Match 2 -->
  <div class="date-header">DATE TBD</div>
  <div class="match-card">
    <div class="match-meta">2nd Match &bull; Lucknow</div>
    <div class="team-row">
      <div class="team-info">
        <div class="team-logo lsg">
          <svg viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm0 13c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
        </div>
        <div class="team-name">LSG</div>
      </div>
    </div>
    <div class="team-row">
      <div class="team-info">
        <div class="team-logo srh">
          <svg viewBox="0 0 24 24"><path d="M12 2.5L8 9h8l-4-6.5zm-7 8.5c0 3.87 3.13 7 7 7s7-3.13 7-7h-2c0 2.76-2.24 5-5 5s-5-2.24-5-5H5z"/></svg>
        </div>
        <div class="team-name">SRH</div>
      </div>
    </div>
    <div class="match-status">7:30 PM</div>
  </div>

  <!-- Match 3 -->
  <div class="date-header">DATE TBD</div>
  <div class="match-card">
    <div class="match-meta">3rd Match &bull; Chennai</div>
    <div class="team-row">
      <div class="team-info">
        <div class="team-logo csk">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        </div>
        <div class="team-name">CSK</div>
      </div>
    </div>
    <div class="team-row">
      <div class="team-info">
        <div class="team-logo rcb">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l-8-4v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-5.45 8-12V7l-8 4z"/></svg>
        </div>
        <div class="team-name">RCB</div>
      </div>
    </div>
    <div class="match-status">7:30 PM</div>
  </div>

  <!-- Match 4 -->
  <div class="date-header">DATE TBD</div>
  <div class="match-card">
    <div class="match-meta">4th Match &bull; Mumbai</div>
    <div class="team-row">
      <div class="team-info">
        <div class="team-logo mi">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        </div>
        <div class="team-name">MI</div>
      </div>
    </div>
    <div class="team-row">
      <div class="team-info">
        <div class="team-logo gt">
          <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        </div>
        <div class="team-name">GT</div>
      </div>
    </div>
    <div class="match-status">7:30 PM</div>
  </div>

  <!-- Match 5 -->
  <div class="date-header">DATE TBD</div>
  <div class="match-card">
    <div class="match-meta">5th Match &bull; Delhi</div>
    <div class="team-row">
      <div class="team-info">
        <div class="team-logo kkr">
          <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-5.45 8-12V5l-9-4zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        </div>
        <div class="team-name">KKR</div>
      </div>
    </div>
    <div class="team-row">
      <div class="team-info">
        <div class="team-logo dc">
          <svg viewBox="0 0 24 24"><path d="M12 2L4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-5.45 8-12V5l-8-3zm0 6c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/></svg>
        </div>
        <div class="team-name">DC</div>
      </div>
    </div>
    <div class="match-status">7:30 PM</div>
  </div>

</body>
</html>
