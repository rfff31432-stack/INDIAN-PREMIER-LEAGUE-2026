<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL Schedule & Points Table - UP T20 Style</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .schedule-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .match-card {
      background: #ffffff;
      border-radius: 20px;
      border: 3px solid #ff9900;
      border-image: linear-gradient(135deg, #ff9900, #ff0055, #2e3192) 1;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }
    .card-header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      font-weight: 800;
      color: #000000;
      font-size: 14px;
    }
    .time-text {
      color: #333333;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .time-dot {
      width: 8px;
      height: 8px;
      background-color: #cccccc;
      border-radius: 50%;
      display: inline-block;
    }
    .card-body {
      background: linear-gradient(135deg, #050b5e, #1a237e);
      padding: 20px 10px;
      color: #ffffff;
      text-align: center;
      position: relative;
    }
    .match-number {
      background: rgba(0,0,0,0.5);
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .teams-vs {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 5px;
    }
    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .team-logo {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .team-logo svg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
    }
    .team-name {
      font-size: 13px;
      font-weight: 700;
      max-width: 110px;
      line-height: 1.2;
    }
    .vs-badge {
      font-size: 24px;
      font-weight: 900;
      color: #ffcc00;
      padding: 0 10px;
      font-style: italic;
    }
    .card-footer {
      background: #ffffff;
      padding: 16px;
      text-align: center;
    }
    .venue-name {
      font-size: 15px;
      font-weight: 800;
      color: #111111;
      margin-bottom: 12px;
    }
    .result-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 10px;
    }
    .result-controls select, .result-controls input {
      padding: 6px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .sim-btn {
      background: #100e68;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .match-status {
      font-size: 12px;
      font-weight: bold;
      color: #008000;
      margin-top: 5px;
    }

    /* Points Table Styling */
    .table-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      margin-top: 25px;
      padding: 15px;
      border: 2px solid #1a237e;
    }
    .table-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .table-title {
      font-size: 16px;
      font-weight: 800;
      color: #100e68;
      text-transform: uppercase;
    }
    .reset-btn {
      background: #dd1d25;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .points-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: center;
    }
    .points-table th {
      background-color: #1a237e;
      color: white;
      padding: 8px 4px;
    }
    .points-table td {
      padding: 8px 4px;
      border-bottom: 1px solid #ddd;
      font-weight: 600;
    }
    .points-table tr:nth-child(even) { background-color: #f9f9f9; }
    .team-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      text-align: left;
    }
    .mini-logo {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: inline-block;
    }
  </style>
</head>

function submitMatch(idx) {
  const m = matches[idx];
  const winner = document.getElementById(`winner-${idx}`).value;
  const winType = document.getElementById(`winType-${idx}`).value;
  const margin = parseFloat(document.getElementById(`margin-${idx}`).value);

  if (!winner || isNaN(margin) || margin <= 0) {
    alert("Kripya Winner aur sahi Margin fill karein!");
    return;
  }

  const loser = (winner === m.t1) ? m.t2 : m.t1;
  let nrrChange = 0;

  // New Rule: 1 run = 1/45 NRR | 1 wicket = 1/95 NRR
  if (winType === 'runs') {
    nrrChange = margin * (1 / 45);
  } else {
    nrrChange = margin * (1 / 95);
  }

  matchResults[idx] = { winner, loser, winType, margin, nrrChange };
  
  // Save to LocalStorage
  localStorage.setItem('iplMatchResults', JSON.stringify(matchResults));

  document.getElementById(`status-${idx}`).innerText = `Winner: ${teamData[winner].short} (${margin} ${winType})`;

  updateTable();
}

function updateTable() {
  // Reset Table data
  Object.keys(pointsTable).forEach(team => {
    pointsTable[team] = { p: 0, w: 0, l: 0, pts: 0, nrr: 0 };
  });

  // Calculate Points & NRR
  Object.values(matchResults).forEach(res => {
    // Winner updates
    pointsTable[res.winner].p += 1;
    pointsTable[res.winner].w += 1;
    pointsTable[res.winner].pts += 2;
    pointsTable[res.winner].nrr += res.nrrChange;

    // Loser updates
    pointsTable[res.loser].p += 1;
    pointsTable[res.loser].l += 1;
    pointsTable[res.loser].nrr -= res.nrrChange;
  });

  // Sort Teams by Points, then NRR
  const sortedTeams = Object.keys(pointsTable).sort((a, b) => {
    if (pointsTable[b].pts !== pointsTable[a].pts) {
      return pointsTable[b].pts - pointsTable[a].pts;
    }
    return pointsTable[b].nrr - pointsTable[a].nrr;
  });

  // Render Table
  const tbody = document.getElementById('pointsTableBody');
  tbody.innerHTML = '';

  sortedTeams.forEach((team, index) => {
    const data = pointsTable[team];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td class="team-cell">
        <span class="mini-logo" style="background-color: ${teamData[team].bg}"></span>
        ${teamData[team].short}
      </td>
      <td>${data.p}</td>
      <td>${data.w}</td>
      <td>${data.l}</td>
      <td>${data.pts}</td>
      <td>${data.nrr > 0 ? '+' : ''}${data.nrr.toFixed(3)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function resetAllData() {
  if (confirm("Kya aap saara saved match result aur points table clear karna chahte hain?")) {
    localStorage.removeItem('iplMatchResults');
    location.reload();
  }
}

// Render Table on initial load
updateTable();
</script>
