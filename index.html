<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unique Independent Team IPL Schedule</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #ffffff; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 480px; }
    .header { text-align: center; font-size: 18px; font-weight: 800; color: #f59e0b; margin-bottom: 15px; text-transform: uppercase; }
    .filter-box select { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #3b82f6; background: #1e293b; color: white; font-weight: bold; margin-bottom: 15px; font-size: 14px; outline: none; }
    .list { display: flex; flex-direction: column; gap: 12px; }
    .card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .top { background: #334155; padding: 8px 14px; display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; font-weight: bold; }
    .body { padding: 16px 10px; display: flex; justify-content: space-around; align-items: center; font-size: 16px; font-weight: 800; }
    .vs { color: #f59e0b; font-size: 14px; font-weight: 900; }
    .bottom { background: #0f172a; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #cbd5e1; border-top: 1px solid #334155; }
    .badge { padding: 3px 8px; border-radius: 6px; font-weight: bold; font-size: 10px; text-transform: uppercase; }
    .home { background: #166534; color: #4ade80; }
    .away { background: #991b1b; color: #fca5a5; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">Unique Team Schedules (No 1-H/1-A)</div>
  
  <div class="filter-box">
    <select id="teamFilter" onchange="renderSchedule()">
      <option value="ALL">All Matches (Full Tournament)</option>
      <option value="KKR">Kolkata Knight Riders (KKR)</option>
      <option value="MI">Mumbai Indians</option>
      <option value="GT">Gujarat Titans</option>
      <option value="RR">Rajasthan Royals</option>
      <option value="SRH">Sunrisers Hyderabad</option>
      <option value="DC">Delhi Capitals</option>
      <option value="PBKS">Punjab Kings</option>
      <option value="LSG">Lucknow Super Giants</option>
    </select>
  </div>

  <div class="list" id="scheduleList"></div>
</div>

<script>
const teamVenues = {
  "KKR": "Eden Gardens, Kolkata", 
  "MI": "Wankhede Stadium, Mumbai",
  "GT": "Narendra Modi Stadium, Ahmedabad", 
  "RR": "Sawai Mansingh Stadium, Jaipur",
  "SRH": "Rajiv Gandhi Stadium, Hyderabad", 
  "DC": "Arun Jaitley Stadium, Delhi",
  "PBKS": "PCA Stadium, Mohali", 
  "LSG": "Ekana Cricket Stadium, Lucknow"
};

// Yahan har match ke liye t1 (Home team) aur t2 (Away team) alag-alag aur independent set kiye gaye hain
const masterSchedule = [
  { matchNo: 1, t1: "KKR", t2: "MI" },
  { matchNo: 2, t1: "KKR", t2: "GT" }, // KKR ke लगातार 2 Home
  { matchNo: 3, t1: "RR", t2: "SRH" },
  { matchNo: 4, t1: "DC", t2: "PBKS" },
  { matchNo: 5, t1: "LSG", t2: "MI" },
  { matchNo: 6, t1: "GT", t2: "KKR" }, // KKR ka Away
  { matchNo: 7, t1: "SRH", t2: "DC" },
  { matchNo: 8, t1: "PBKS", t2: "RR" },
  { matchNo: 9, t1: "MI", t2: "LSG" },
  { matchNo: 10, t1: "KKR", t2: "RR" }, // KKR ka Home phir se
  { matchNo: 11, t1: "GT", t2: "MI" },
  { matchNo: 12, t1: "SRH", t2: "LSG" },
  { matchNo: 13, t1: "DC", t2: "GT" },
  { matchNo: 14, t1: "RR", t2: "PBKS" },
  { matchNo: 15, t1: "LSG", t2: "KKR" }, // KKR ka Away
  { matchNo: 16, t1: "MI", t2: "SRH" },
  { matchNo: 17, t1: "PBKS", t2: "DC" },
  { matchNo: 18, t1: "KKR", t2: "DC" }, // KKR Home
  { matchNo: 19, t1: "GT", t2: "RR" },
  { matchNo: 20, t1: "LSG", t2: "SRH" },
  { matchNo: 21, t1: "MI", t2: "PBKS" },
  { matchNo: 22, t1: "RR", t2: "KKR" }, // KKR Away
  { matchNo: 23, t1: "SRH", t2: "GT" },
  { matchNo: 24, t1: "DC", t2: "MI" },
  { matchNo: 25, t1: "PBKS", t2: "LSG" },
  { matchNo: 26, t1: "KKR", t2: "SRH" }, // KKR Home
  { matchNo: 27, t1: "GT", t2: "DC" },
  { matchNo: 28, t1: "RR", t2: "MI" },
  { matchNo: 29, t1: "LSG", t2: "PBKS" },
  { matchNo: 30, t1: "SRH", t2: "KKR" }, // KKR Away (लगातार Away स्ट्रीक)
  { matchNo: 31, t1: "MI", t2: "GT" },
  { matchNo: 32, t1: "DC", t2: "RR" },
  { matchNo: 33, t1: "PBKS", t2: "SRH" },
  { matchNo: 34, t1: "KKR", t2: "PBKS" }, // KKR Home
  { matchNo: 35, t1: "LSG", t2: "GT" },
  { matchNo: 36, t1: "MI", t2: "DC" },
  { matchNo: 37, t1: "RR", t2: "LSG" },
  { matchNo: 38, t1: "SRH", t2: "PBKS" },
  { matchNo: 39, t1: "GT", t2: "KKR" }, // KKR Away
  { matchNo: 40, t1: "DC", t2: "LSG" },
  { matchNo: 41, t1: "PBKS", t2: "MI" },
  { matchNo: 42, t1: "RR", t2: "GT" },
  { matchNo: 43, t1: "KKR", t2: "LSG" }, // KKR Home
  { matchNo: 44, t1: "SRH", t2: "MI" },
  { matchNo: 45, t1: "DC", t2: "SRH" },
  { matchNo: 46, t1: "GT", t2: "PBKS" },
  { matchNo: 47, t1: "LSG", t2: "RR" },
  { matchNo: 48, t1: "MI", t2: "KKR" }, // KKR Away
  { matchNo: 49, t1: "PBKS", t2: "GT" },
  { matchNo: 50, t1: "DC", t2: "KKR" }, // KKR Away (लगातार 3rd Away)
  { matchNo: 51, t1: "LSG", t2: "MI" },
  { matchNo: 52, t1: "SRH", t2: "RR" },
  { matchNo: 53, t1: "GT", t2: "LSG" },
  { matchNo: 54, t1: "PBKS", t2: "DC" },
  { matchNo: 55, t1: "RR", t2: "GT" },
  { matchNo: 56, t1: "KKR", t2: "MI" }  // KKR Home
];

function renderSchedule() {
  const selected = document.getElementById('teamFilter').value;
  const list = document.getElementById('scheduleList');
  list.innerHTML = '';

  let filtered = masterSchedule;
  if (selected !== 'ALL') {
    filtered = masterSchedule.filter(m => m.t1 === selected || m.t2 === selected);
  }

  filtered.forEach(m => {
    let tag = '';
    if (selected !== 'ALL') {
      const isHome = m.t1 === selected;
      tag = isHome ? '<span class="badge home">Home Match</span>' : '<span class="badge away">Away Match</span>';
    }

    list.innerHTML += `
      <div class="card">
        <div class="top">
          <span>Match No: ${m.matchNo}</span>
          <span>7:30 PM IST</span>
        </div>
        <div class="body">
          <span>${m.t1}</span>
          <span class="vs">VS</span>
          <span>${m.t2}</span>
        </div>
        <div class="bottom">
          <span>📍 ${teamVenues[m.t1]}</span>
          ${tag}
        </div>
      </div>
    `;
  });
}

renderSchedule();
</script>

</body>
</html>
