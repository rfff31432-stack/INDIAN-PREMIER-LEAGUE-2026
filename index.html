<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL Schedule (56 Matches) & Points Table</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .global-control-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      border: 2px solid #ff9900;
      margin-bottom: 20px;
    }
    .control-title {
      font-size: 15px;
      font-weight: 800;
      color: #100e68;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-align: center;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .form-group select, .form-group input {
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    .update-btn {
      background: linear-gradient(135deg, #100e68, #1a237e);
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .table-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      margin-bottom: 25px;
      padding: 15px;
      border: 2px solid #1a237e;
    }
    .table-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .table-title {
      font-size: 16px;
      font-weight: 800;
      color: #100e68;
      text-transform: uppercase;
    }
    .reset-btn {
      background: #dd1d25;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .points-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: center;
    }
    .points-table th {
      background-color: #1a237e;
      color: white;
      padding: 8px 4px;
    }
    .points-table td {
      padding: 8px 4px;
      border-bottom: 1px solid #ddd;
      font-weight: 600;
    }
    .points-table tr:nth-child(even) { background-color: #f9f9f9; }

    .schedule-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .match-card {
      background: #ffffff;
      border-radius: 20px;
      border: 3px solid #ff9900;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }
    .card-header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      font-weight: 800;
      color: #000000;
      font-size: 14px;
    }
    .time-text {
      color: #333333;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .time-dot {
      width: 8px;
      height: 8px;
      background-color: #cccccc;
      border-radius: 50%;
      display: inline-block;
    }
    .card-body {
      background: linear-gradient(135deg, #050b5e, #1a237e);
      padding: 20px 10px;
      color: #ffffff;
      text-align: center;
    }
    .match-number {
      background: rgba(0,0,0,0.5);
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .teams-vs {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .team-logo {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .team-logo svg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
    }
    .team-name {
      font-size: 13px;
      font-weight: 700;
    }
    .vs-badge {
      font-size: 24px;
      font-weight: 900;
      color: #ffcc00;
      padding: 0 10px;
    }
    .card-footer {
      background: #ffffff;
      padding: 12px 16px;
      text-align: center;
    }
    .venue-name {
      font-size: 14px;
      font-weight: 800;
      color: #111111;
    }
    .match-status {
      font-size: 12px;
      font-weight: bold;
      color: #008000;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="global-control-card">
  <div class="control-title">Update Match Result</div>
  <div class="form-group">
    <select id="globalMatchSelect" onchange="populateTeams()">
      <option value="">-- Select Match --</option>
    </select>
    <select id="globalWinnerSelect">
      <option value="">-- Select Winner --</option>
    </select>
    <select id="globalWinType">
      <option value="runs">Win by Runs</option>
      <option value="wickets">Win by Wickets</option>
    </select>
    <input type="number" id="globalMargin" placeholder="Margin (Runs / Wickets)" min="1">
    <button class="update-btn" onclick="submitGlobalMatch()">Update Result</button>
  </div>
</div>

<div class="table-card">
  <div class="table-header-flex">
    <div class="table-title">IPL Points Table</div>
    <button class="reset-btn" onclick="resetAllData()">Reset All</button>
  </div>
  <table class="points-table">
    <thead>
      <tr>
        <th>Pos</th>
        <th style="text-align:left;">Team</th>
        <th>P</th>
        <th>W</th>
        <th>L</th>
        <th>Pts</th>
        <th>NRR</th>
      </tr>
    </thead>
    <tbody id="pointsTableBody"></tbody>
  </table>
</div>

<div class="schedule-container" id="schedule"></div>

<script>
const teamData = {
  "Mumbai Indians": { short: "MI", venue: "Wankhede Stadium, Mumbai", bg: "#004ba0", svg: `<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>` },
  "Kolkata Knight Riders": { short: "KKR", venue: "Eden Gardens, Kolkata", bg: "#2e1437", svg: `<svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>` },
  "Gujarat Titans": { short: "GT", venue: "Narendra Modi Stadium, Ahmedabad", bg: "#0b1326", svg: `<svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>` },
  "Rajasthan Royals": { short: "RR", venue: "Sawai Mansingh Stadium, Jaipur", bg: "#d6156c", svg: `<svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>` },
  "Lucknow Super Giants": { short: "LSG", venue: "Ekana Cricket Stadium, Lucknow", bg: "#6b0000", svg: `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>` },
  "Punjab Kings": { short: "PBKS", venue: "HPCA Stadium, Dharamshala", bg: "#dd1d25", svg: `<svg viewBox="0 0 24 24"><path d="M12 2L4 5v6c0 5.25 3.4 10.2 8 11.5 4.6-1.3 8-6.25 8-11.5V5l-8-3zm0 4c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/></svg>` },
  "Delhi Capitals": { short: "DC", venue: "Arun Jaitley Stadium, Delhi", bg: "#002f6c", svg: `<svg viewBox="0 0 24 24"><path d="M12 1L2 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-10-5zm0 4a3 3 0 110 6 3 3 0 010-6z"/></svg>` },
  "Sunrisers Hyderabad": { short: "SRH", venue: "Rajiv Gandhi Stadium, Hyderabad", bg: "#e64a19", svg: `<svg viewBox="0 0 24 24"><path d="M12 2.59l5.7 5.7-1.42 1.42L13 6.41V16h-2V6.41l-3.28 3.3-1.42-1.42L12 2.59zM4 18h16v2H4z"/></svg>` }
};

// Auto-generate 56 double round-robin matches
function generateSchedule() {
  const teamList = Object.keys(teamData);
  const totalTeams = teamList.length;
  let schedule = [];
  let matchId = 1;

  // Round-robin Leg 1 (Home Games)
  for (let round = 0; round < totalTeams - 1; round++) {
    for (let i = 0; i < totalTeams / 2; i++) {
      const home = teamList[(round + i) % (totalTeams - 1)];
      let away = teamList[(totalTeams - 1 - i + round) % (totalTeams - 1)];
      if (i === 0) away = teamList[totalTeams - 1];

      schedule.push({
        id: String(matchId++).padStart(2, '0'),
        t1: home,
        t2: away,
        venue: teamData[home].venue,
        date: "Date TBD",
        time: "7:30 PM"
      });
    }
  }

  // Round-robin Leg 2 (Away Games - Reversed Home/Away)
  for (let round = 0; round < totalTeams - 1; round++) {
    for (let i = 0; i < totalTeams / 2; i++) {
      let home = teamList[(totalTeams - 1 - i + round) % (totalTeams - 1)];
      const away = teamList[(round + i) % (totalTeams - 1)];
      if (i === 0) home = teamList[totalTeams - 1];

      schedule.push({
        id: String(matchId++).padStart(2, '0'),
        t1: home,
        t2: away,
        venue: teamData[home].venue,
        date: "Date TBD",
        time: "7:30 PM"
      });
    }
  }

  return schedule;
}

const matches = generateSchedule();
let matchResults = JSON.parse(localStorage.getItem('iplMatchResults')) || {};
let pointsTable = {};

function initPointsTable() {
  pointsTable = {};
  Object.keys(teamData).forEach(team => {
    pointsTable[team] = { p: 0, w: 0, l: 0, pts: 0, nrr: 0 };
  });
}

function calculateTable() {
  initPointsTable();
  Object.keys(matchResults).forEach(idx => {
    const res = matchResults[idx];
    const m = matches[idx];
    if (m && res) {
      const winner = res.winner;
      const loser = (winner === m.t1) ? m.t2 : m.t1;
      
      if (pointsTable[winner]) {
        pointsTable[winner].p += 1;
        pointsTable[winner].w += 1;
        pointsTable[winner].pts += 2;
        pointsTable[winner].nrr += res.nrrChange;
      }
      if (pointsTable[loser]) {
        pointsTable[loser].p += 1;
        pointsTable[loser].l += 1;
        pointsTable[loser].nrr -= res.nrrChange;
      }
    }
  });
  renderPointsTable();
}

function renderPointsTable() {
  const tbody = document.getElementById('pointsTableBody');
  tbody.innerHTML = '';
  
  const sorted = Object.keys(pointsTable).sort((a, b) => {
    if (pointsTable[b].pts !== pointsTable[a].pts) {
      return pointsTable[b].pts - pointsTable[a].pts;
    }
    return pointsTable[b].nrr - pointsTable[a].nrr;
  });

  sorted.forEach((team, index) => {
    const d = pointsTable[team];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td style="text-align:left;">${teamData[team].short}</td>
      <td>${d.p}</td>
      <td>${d.w}</td>
      <td>${d.l}</td>
      <td>${d.pts}</td>
      <td>${d.nrr.toFixed(2)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function renderMatches() {
  const container = document.getElementById('schedule');
  const matchSelect = document.getElementById('globalMatchSelect');
  container.innerHTML = '';
  matchSelect.innerHTML = '<option value="">-- Select Match --</option>';

  matches.forEach((m, idx) => {
    const team1 = teamData[m.t1];
    const team2 = teamData[m.t2];

    const opt = document.createElement('option');
    opt.value = idx;
    opt.innerText = `Match ${m.id}: ${teamData[m.t1].short} vs ${teamData[m.t2].short}`;
    matchSelect.appendChild(opt);

    const savedRes = matchResults[idx];
    const statusText = savedRes ? `Winner: ${teamData[savedRes.winner].short} (${savedRes.margin} ${savedRes.winType})` : '';

    const card = document.createElement('div');
    card.className = 'match-card';
    card.innerHTML = `
      <div class="card-header">
        <span>${m.date}</span>
        <span class="time-text"><span class="time-dot"></span> ${m.time} IST</span>
      </div>
      <div class="card-body">
        <div class="match-number">Match ${m.id}</div>
        <div class="teams-vs">
          <div class="team">
            <div class="team-logo" style="background-color: ${team1.bg}">${team1.svg}</div>
            <div class="team-name">${teamData[m.t1].short}</div>
          </div>
          <div class="vs-badge">VS</div>
          <div class="team">
            <div class="team-logo" style="background-color: ${team2.bg}">${team2.svg}</div>
            <div class="team-name">${teamData[m.t2].short}</div>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <div class="venue-name">${m.venue}</div>
        <div class="match-status">${statusText}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function populateTeams() {
  const idx = document.getElementById('globalMatchSelect').value;
  const winnerSelect = document.getElementById('globalWinnerSelect');
  winnerSelect.innerHTML = '<option value="">-- Select Winner --</option>';

  if (idx !== "") {
    const m = matches[idx];
    const opt1 = document.createElement('option');
    opt1.value = m.t1;
    opt1.innerText = m.t1;
    const opt2 = document.createElement('option');
    opt2.value = m.t2;
    opt2.innerText = m.t2;

    winnerSelect.appendChild(opt1);
    winnerSelect.appendChild(opt2);
  }
}

function submitGlobalMatch() {
  const idx = document.getElementById('globalMatchSelect').value;
  const winner = document.getElementById('globalWinnerSelect').value;
  const winType = document.getElementById('globalWinType').value;
  const margin = parseFloat(document.getElementById('globalMargin').value);

  if (idx === "" || !winner || isNaN(margin) || margin <= 0) {
    alert("Kripya Match, Winner aur Sahi Margin fill karein!");
    return;
  }

  const nrrChange = (winType === 'runs') ? margin * 0.02 : margin * 0.01;

  matchResults[idx] = { winner, winType, margin, nrrChange };
  localStorage.setItem('iplMatchResults', JSON.stringify(matchResults));

  calculateTable();
  renderMatches();
}

function resetAllData() {
  localStorage.removeItem('iplMatchResults');
  matchResults = {};
  calculateTable();
  renderMatches();
}

// Initial Load
calculateTable();
renderMatches();
</script>

</body>
</html>
