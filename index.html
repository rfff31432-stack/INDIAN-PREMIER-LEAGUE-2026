<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL Schedule & Points Table - UP T20 Style</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* Top Global Controller Box */
    .global-control-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      border: 2px solid #ff9900;
      margin-bottom: 20px;
    }
    .control-title {
      font-size: 15px;
      font-weight: 800;
      color: #100e68;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-align: center;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .form-group select, .form-group input {
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    .update-btn {
      background: linear-gradient(135deg, #100e68, #1a237e);
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    /* Points Table Styling */
    .table-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      margin-bottom: 25px;
      padding: 15px;
      border: 2px solid #1a237e;
    }
    .table-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .table-title {
      font-size: 16px;
      font-weight: 800;
      color: #100e68;
      text-transform: uppercase;
    }
    .reset-btn {
      background: #dd1d25;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .points-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: center;
    }
    .points-table th {
      background-color: #1a237e;
      color: white;
      padding: 8px 4px;
    }
    .points-table td {
      padding: 8px 4px;
      border-bottom: 1px solid #ddd;
      font-weight: 600;
    }
    .points-table tr:nth-child(even) { background-color: #f9f9f9; }
    .team-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
    }
    .mini-logo-svg {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      flex-shrink: 0;
    }
    .mini-logo-svg svg {
      width: 100%;
      height: 100%;
      fill: #ffffff;
    }

    /* Schedule Styling */
    .schedule-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .match-card {
      background: #ffffff;
      border-radius: 20px;
      border: 3px solid #ff9900;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }
    .card-header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      font-weight: 800;
      color: #000000;
      font-size: 14px;
    }
    .time-text {
      color: #333333;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .time-dot {
      width: 8px;
      height: 8px;
      background-color: #cccccc;
      border-radius: 50%;
      display: inline-block;
    }
    .card-body {
      background: linear-gradient(135deg, #050b5e, #1a237e);
      padding: 20px 10px;
      color: #ffffff;
      text-align: center;
      position: relative;
    }
    .match-number {
      background: rgba(0,0,0,0.5);
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .teams-vs {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 5px;
    }
    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .team-logo {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .team-logo svg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
    }
    .team-name {
      font-size: 13px;
      font-weight: 700;
      max-width: 110px;
      line-height: 1.2;
    }
    .vs-badge {
      font-size: 24px;
      font-weight: 900;
      color: #ffcc00;
      padding: 0 10px;
      font-style: italic;
    }
    .card-footer {
      background: #ffffff;
      padding: 12px 16px;
      text-align: center;
    }
    .venue-name {
      font-size: 14px;
      font-weight: 800;
      color: #111111;
    }
    .match-status {
      font-size: 12px;
      font-weight: bold;
      color: #008000;
      margin-top: 6px;
    }
  </style>
</head>

<!-- 1. Top Result Updater Box -->
<div class="global-control-card">
  <div class="control-title">Update Match Result</div>
  <div class="form-group">

    <select id="globalWinnerSelect">

    </select>
    <select id="globalWinType">
      <option value="runs">Win by Runs</option>
      <option value="wickets">Win by Wickets</option>
    </select>
    <input type="number" id="globalMargin" placeholder="Margin (Runs / Wickets)" min="1">
    <button class="update-btn" onclick="submitGlobalMatch()">Update Result</button>
  </div>
</div>

<!-- 2. Points Table -->
<div class="table-card">

    <div class="table-title">IPL Points Table (8 Teams)</div>
    <button class="reset-btn" onclick="resetAllData()">Reset All</button>
  </div>

    <thead>

        <th>L</th>
        <th>Pts</th>
        <th>NRR</th>

</div>

function populateTeams() {
  const idx = matchSelect.value;
  const winnerSelect = document.getElementById('globalWinnerSelect');
  winnerSelect.innerHTML = '<option value="">-- Select Winner --</option>';

  if (idx !== "") {
    const m = matches[idx];
    const opt1 = document.createElement('option');
    opt1.value = m.t1;
    opt1.innerText = m.t1;
    
    const opt2 = document.createElement('option');
    opt2.value = m.t2;
    opt2.innerText = m.t2;

    winnerSelect.appendChild(opt1);
    winnerSelect.appendChild(opt2);

    if (matchResults[idx]) {
      winnerSelect.value = matchResults[idx].winner;
      document.getElementById('globalWinType').value = matchResults[idx].winType;
      document.getElementById('globalMargin').value = matchResults[idx].margin;
    } else {
      document.getElementById('globalMargin').value = '';
    }
  }
}
