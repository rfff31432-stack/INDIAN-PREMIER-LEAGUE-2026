<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Matches & Points Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #1a237e;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        /* Input Box design */
        .update-box {
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 2px solid #1a237e;
        }
        .update-box input {
            width: 70%;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .update-box button {
            padding: 10px 15px;
            font-size: 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .update-box button:hover {
            background-color: #218838;
        }

        /* Points Table design */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #1a237e;
            color: white;
        }
        tr:nth-child(even) { background-color: #f8f9fa; }

        /* Schedule design */
        .schedule {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .match-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            font-weight: bold;
        }
        .match-card:last-child {
            border-bottom: none;
        }
        .team { color: #333; }
        .vs { color: #d9534f; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏆 Tournament Leaderboard & Schedule</h2>

    <!-- ======================================================== -->
    <!-- 👇👇👇 INPUT BOX IS RIGHT HERE / इनपुट बॉक्स यहाँ है 👇👇👇 -->
    <!-- ======================================================== -->
    <div class="update-box">
        <h3>Match Result Entry (यहाँ मैच का नतीजा लिखें):</h3>
        
        <!-- YAHI HAI INPUT BOX -->
        <input type="text" id="resultInput" placeholder="उदा. Lokhariya Nawaz 18 over 7 wicket se jeete">
        
        <button onclick="processResult()">Update Table</button>
        <p id="msg" style="color: green; font-weight: bold; margin-top: 10px;"></p>
    </div>
    <!-- ======================================================== -->

    <!-- Schedule Header -->
    <div class="schedule">
        <h3>📅 Matches Schedule</h3>
        <div class="match-card">
            <span class="team">Kashi Mira</span>
            <span class="vs">VS</span>
            <span class="team">Qazi king</span>
        </div>
        <div class="match-card">
            <span class="team">Lokhariya Nawaz</span>
            <span class="vs">VS</span>
            <span class="team">Tahateri Kobra</span>
        </div>
        <div class="match-card">
            <span class="team">miju huwa</span>
            <span class="vs">VS</span>
            <span class="team">Gallery kopu</span>
        </div>
    </div>

    <br>

    <!-- Points Table -->
    <h3>📊 Points Table</h3>
    <table id="pointsTable">
        <thead>
            <tr>
                <th>Team</th>
                <th>P</th>
                <th>W</th>
                <th>L</th>
                <th>NRR</th>
                <th>PTS</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dynamic Data generated by JS -->
        </tbody>
    </table>
</div>

<script>
    // 6 Teams Data Engine
    let teams = [
        { name: "Kashi Mira", p: 0, w: 0, l: 0, nrr: 0.000, pts: 0 },
        { name: "Qazi king", p: 0, w: 0, l: 0, nrr: 0.000, pts: 0 },
        { name: "Lokhariya Nawaz", p: 0, w: 0, l: 0, nrr: 0.000, pts: 0 },
        { name: "Tahateri Kobra", p: 0, w: 0, l: 0, nrr: 0.000, pts: 0 },
        { name: "miju huwa", p: 0, w: 0, l: 0, nrr: 0.000, pts: 0 },
        { name: "Gallery kopu", p: 0, w: 0, l: 0, nrr: 0.000, pts: 0 }
    ];

    const matches = [
        ["Kashi Mira", "Qazi king"],
        ["Lokhariya Nawaz", "Tahateri Kobra"],
        ["miju huwa", "Gallery kopu"]
    ];

    // Table Render Function
    function renderTable() {
        // Sort teams based on Points first, then NRR
        teams.sort((a, b) => b.pts - a.pts || b.nrr - a.nrr);
        
        const tbody = document.querySelector("#pointsTable tbody");
        tbody.innerHTML = "";

        teams.forEach(team => {
            let row = `<tr>
                <td><b>${team.name}</b></td>
                <td>${team.p}</td>
                <td>${team.w}</td>
                <td>${team.l}</td>
                <td>${team.nrr > 0 ? '+' : ''}${team.nrr.toFixed(3)}</td>
                <td><b>${team.pts}</b></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    // Input Reader and Live Points Table Updater
    function processResult() {
        const input = document.getElementById("resultInput").value.trim();
        const msg = document.getElementById("msg");
        
        if (!input) {
            msg.style.color = "red";
            msg.innerText = "Kripya match result text enter karein.";
            return;
        }

        let winnerTeam = null;
        let loserTeam = null;

        // Auto identify winner from text input
        for (let team of teams) {
            if (input.toLowerCase().includes(team.name.toLowerCase())) {
                winnerTeam = team.name;
                break;
            }
        }

        if (!winnerTeam) {
            msg.style.color = "red";
            msg.innerText = "Sahi team ka naam text me nahi mila!";
            return;
        }

        // Find match & loser team
        for (let match of matches) {
            if (match.includes(winnerTeam)) {
                loserTeam = match[0] === winnerTeam ? match[1] : match[0];
                break;
            }
        }

        // Update Stats dynamically
        teams.forEach(t => {
            if (t.name === winnerTeam) {
                t.p += 1;
                t.w += 1;
                t.pts += 2;
                t.nrr += 0.500;
            } else if (t.name === loserTeam) {
                t.p += 1;
                t.l += 1;
                t.nrr -= 0.500;
            }
        });

        renderTable();
        msg.style.color = "green";
        msg.innerText = `Success: Points table updated for ${winnerTeam} victory!`;
        document.getElementById("resultInput").value = "";
    }

    // Initial render on page load
    renderTable();
</script>

</body>
</html>
